name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/elixir-ci.yml@12cc6f75e443f1735ba4c85f909940babcbbc623 # main
    with:
      enable-docs-deploy: true
      enable-release: true
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
